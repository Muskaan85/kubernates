# name of the workflow that we see in github actions
name: kubernetes

# this workflow execute when some one runs code
on: [push]

# reside actual work, each job = one task , can have many jobs
jobs:
  deployproject:
      runs-on: ubuntu-latest
      steps:
          - uses: actions/checkout@v4
          - name: Python CI
            uses: actions/setup-python@v5
            with:
              python-version: '3.10'

          - name: install dependencies
            run:  pip install -r requirements.txt

          - name: run test cases
            run:  pytest

          - name: Login to DockerHub
            run: |
                echo "${{ secrets.DOCKER_PWD}}" | docker login \
                  -u "${{ secrets.DOCKER_USERNAME }}" \
                  --password-stdin

          - name: build docker image
            run:  docker build -t muskaan85/kubernetes:latest .

          - name: push to docker hub
            run:  docker push muskaan85/kubernestes:latest
      